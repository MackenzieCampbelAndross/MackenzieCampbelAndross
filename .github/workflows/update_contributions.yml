name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Contribution Graph SVG
        run: python scripts/generate_contrib_svg.py

      - name: Commit & Push if changed
        run: |
          git config user.name "MackenzieCampbelAndross"
          git config user.email "mackenzieandross@gmail.com"
          git add assets/contributions.svg
          git diff --staged --quiet || (git commit -m "chore(cron): auto-update contribution graph" && git push)
